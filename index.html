<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#120c24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="彈珠勇者">
  <meta name="description" content="自動戰鬥 × 彈珠倍率 × 三選一技能的 Roguelike 手遊">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>彈珠勇者</title>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <span id="hud-wave" class="pill">第 1/15 波</span>
      <span class="pill"><span id="hud-gem"></span><b id="hud-coins">0</b></span>
      <span class="hud-btns">
        <button id="btn-speed" class="icon-btn">x1</button>
        <button id="btn-pause" class="icon-btn">II</button>
      </span>
    </div>

    <div id="banner"></div>
    <div id="toast"></div>

    <div id="screen-home" class="screen"><div id="home-body" class="panel home"></div></div>
    <div id="screen-shop" class="screen overlay hidden"><div id="shop-body" class="panel"></div></div>
    <div id="screen-result" class="screen overlay hidden"><div id="result-body" class="panel center"></div></div>
    <div id="screen-pause" class="screen overlay hidden">
      <div class="panel center">
        <h2>暫停</h2>
        <button class="btn big" id="btn-resume">繼續</button>
        <button class="btn ghost" id="btn-quit">放棄本局</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
