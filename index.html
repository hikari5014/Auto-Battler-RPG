<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#120c24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="彈珠勇者">
  <meta name="description" content="自動戰鬥 × 彈珠倍率 × 三選一技能的 Roguelike 手遊">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>彈珠勇者</title>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-wave pill">
        <span id="hud-wave">第 1/15 波</span>
        <div id="wavebar" class="wavebar"></div>
      </div>
      <span id="hud-coin-pill" class="pill coins"><span id="hud-gem"></span><b id="hud-coins">0</b></span>
      <span class="hud-btns">
        <button id="btn-skills" class="icon-btn skills-btn" aria-label="我的技能"><span id="skills-ic"></span><b id="skill-count">0</b></button>
        <button id="btn-speed" class="icon-btn">x1</button>
        <button id="btn-pause" class="icon-btn">II</button>
      </span>
    </div>

    <!-- 戰鬥中即時數值（點一下打開完整數值與技能） -->
    <div id="live-stats" class="hidden"></div>

    <!-- 雙職業：切換按鈕放在戰場左下角，手指好按 -->
    <!-- 3.14 自動掛機：戰鬥中顯示，點一下停止 -->
    <button id="auto-badge" class="hidden" aria-label="停止自動冒險"></button>

    <button id="btn-switch" class="icon-btn switch-btn hidden" aria-label="切換職業"><span id="switch-ic"></span><i class="cd"></i><b>換手</b><em class="sw-hp"></em></button>

    <!-- 新手教學：光圈＋對話框 -->
    <div id="coach" class="hidden">
      <div class="coach-ring"></div>
      <div class="coach-bubble"><p class="coach-text"></p><button class="btn small coach-btn">知道了</button></div>
    </div>

    <div id="banner"></div>
    <div id="flash"></div>
    <div id="toast"></div>

    <div id="screen-home" class="screen"><div id="home-body" class="panel home"></div></div>
    <div id="screen-shop" class="screen overlay hidden"><div id="shop-body" class="panel"></div></div>
    <div id="screen-result" class="screen overlay hidden"><div id="result-body" class="panel center"></div></div>
    <div id="screen-event" class="screen overlay hidden"><div id="event-body" class="panel mystic"></div></div>
    <div id="screen-skills" class="screen overlay hidden"><div id="skills-body" class="panel"></div></div>
    <div id="screen-endless" class="screen overlay hidden"><div id="endless-body" class="panel center"></div></div>
    <div id="screen-ach" class="screen overlay hidden"><div id="ach-body" class="panel"></div></div>
    <div id="screen-quest" class="screen overlay hidden"><div id="quest-body" class="panel"></div></div>
    <div id="screen-modes" class="screen overlay hidden"><div id="modes-body" class="panel"></div></div>
    <div id="screen-map" class="screen overlay hidden"><div id="map-body" class="panel"></div></div>
    <div id="screen-route" class="screen overlay hidden"><div id="route-body" class="panel mystic"></div></div>
    <div id="screen-live" class="screen overlay hidden"><div id="live-body" class="panel"></div></div>
    <div id="screen-mail" class="screen overlay hidden"><div id="mail-body" class="panel"></div></div>
    <div id="screen-gacha" class="screen overlay hidden"><div id="gacha-body" class="panel"></div></div>
    <div id="screen-daily" class="screen overlay hidden"><div id="daily-body" class="panel center"></div></div>
    <div id="screen-talent" class="screen overlay hidden"><div id="talent-body" class="panel"></div></div>
    <div id="screen-heroes" class="screen overlay hidden"><div id="heroes-body" class="panel"></div></div>
    <div id="screen-mount" class="screen overlay hidden"><div id="mount-body" class="panel"></div></div>
    <div id="screen-gear" class="screen overlay hidden"><div id="gear-body" class="panel"></div></div>
    <div id="screen-settings" class="screen overlay hidden"><div id="settings-body" class="panel"></div></div>
    <div id="screen-info" class="screen overlay hidden"><div id="info-body" class="panel center"></div></div>
    <div id="screen-pause" class="screen overlay hidden">
      <div class="panel center">
        <h2>暫停</h2>
        <button class="btn big" id="btn-resume">繼續</button>
        <button class="btn ghost" id="btn-quit">放棄本局</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
